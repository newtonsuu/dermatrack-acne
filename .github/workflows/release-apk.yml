name: Build Release APK

# Builds a release Android APK and publishes it as a GitHub Release asset.
# Triggered by pushing a version tag (v*) or manually from the Actions tab.
#
# Supabase credentials are injected at build time from repo secrets
# (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# The anon key is safe to embed in a client app (RLS enforces access).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        working-directory: app
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dermatrack-release-apks
          path: app/build/app/outputs/flutter-apk/*-release.apk

      - name: Publish APKs to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/*-release.apk
          body: |
            DermaTrack release build.

            Install **app-arm64-v8a-release.apk** on essentially any modern
            Android phone (enable "Install unknown apps" for your browser/file
            manager first). The armeabi-v7a build is for older 32-bit devices.

            Built against the configured Supabase backend.
